name: Needle Trainer
on:
  push:
    branches:
      - master
      - 'feat/**'
      - 'fix/**'
    paths:
      - 'addon-needle-trainer/**'
      - 'addon-needle/**'
      - '.github/workflows/needle-trainer.yml'
  pull_request:
    paths:
      - 'addon-needle-trainer/**'
      - '.github/workflows/needle-trainer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate addon manifest
        run: |
          python -m pip install --disable-pip-version-check PyYAML numpy
          python - <<'PY'
          import yaml
          from pathlib import Path
          config = yaml.safe_load(Path("addon-needle-trainer/config.yaml").read_text())
          assert config["boot"] == "manual"
          assert config["startup"] == "once"
          assert config["options"]["mode"] == "idle"
          assert config["options"]["confirm_resource_use"] is False
          assert config["map"] == [{"type": "share", "read_only": False}]
          assert config["arch"] == ["amd64", "aarch64"]
          print("One-shot trainer manifest is safe by default.")
          PY
      - name: Check Python and curate training corpus
        run: |
          python -m compileall -q addon-needle-trainer/app
          python addon-needle-trainer/app/training/workflow.py prepare --scenarios addon-needle-trainer/app/training/scenarios.json --output "${RUNNER_TEMP}/needle-data"
      - name: Offline resource safety tests
        run: python -m unittest discover -s addon-needle-trainer/tests -v
      - name: Verify automatic model approval and base fallback
        run: python -m unittest discover -s addon-needle/tests -v
      - name: Check model selection startup syntax
        run: bash -n addon-needle/rootfs/app/entrypoint.sh

  image:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated training image (amd64)
        run: |
          docker build --pull -f addon-needle-trainer/Dockerfile \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg NEEDLE_VERSION=3.1.3 \
            -t local/needle-trainer:ci addon-needle-trainer
      - name: Check pinned Needle CLI
        run: docker run --rm --entrypoint needle local/needle-trainer:ci --help
      - name: Smoke test JAX and resumable head checkpoint
        run: |
          docker run --rm --entrypoint python3 local/needle-trainer:ci -c '
          import jax, jax.numpy as jnp, tempfile
          from pathlib import Path
          from local_confidence import save_progress, load_progress
          with tempfile.TemporaryDirectory() as d:
              p = Path(d) / "confidence_head.npz"
              head = {"proj": {"kernel": jnp.ones((2, 1))}}
              save_progress(head, p, step=2, fingerprint="test",
                            losses=[0.4], total_steps=8)
              restored, step, total = load_progress(p, "test")
              assert step == 2 and total == 8
              assert restored["proj"]["kernel"].shape == (2, 1)
          print("CPU-only JAX + atomic confidence-head checkpoint OK")
          '
      - name: Compile and differentiate real tiny Needle engram confidence head
        run: |
          docker run --rm \
            --env JAX_PLATFORMS=cpu \
            -v "$PWD/addon-needle-trainer/tests:/work/tests:ro" \
            --entrypoint python3 local/needle-trainer:ci \
            /work/tests/smoke_confidence_grad.py
