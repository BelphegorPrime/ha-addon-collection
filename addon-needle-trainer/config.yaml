name: "Needle Trainer (Experimental)"
description: "Manual, low-priority CPU-only Needle LoRA experiments on your HA host"
version: "0.2.8"
slug: "addon_needle_trainer"
url: "https://github.com/BelphegorPrime/ha-addon-collection/tree/master/addon-needle-trainer"
arch:
  - amd64
  - aarch64
init: false
startup: once
boot: manual
map:
  - type: share
    read_only: false
options:
  mode: "idle"
  confirm_resource_use: false
  confirm_uncalibrated_export: false
  memory_limit_mib: 4096
  reserve_memory_mib: 2048
  cpu_core: -1
  epochs: 1
  calibration_steps_per_run: 8
  calibration_epochs: 2
schema:
  mode: "list(idle|prepare|download|download_tokenizer|download_base|train|calibrate|calibrate_all|export_local|evaluate_local|diagnose_local|prepare_experiment|experiment_train|experiment_calibrate_all|experiment_export|experiment_validate|experiment_test|build)"
  confirm_resource_use: bool
  confirm_uncalibrated_export: bool
  memory_limit_mib: int
  reserve_memory_mib: int
  cpu_core: int
  epochs: int
  calibration_steps_per_run: int
  calibration_epochs: int
